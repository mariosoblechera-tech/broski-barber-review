<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Broski Barbería — Déjanos tu reseña</title>
<meta name="description" content="Cuéntanos qué tal tu visita a Broski Barbería y déjanos una reseña en Google." />
<meta name="theme-color" content="#000000" />
<link rel="icon" type="image/jpeg" href="/logo.jpg" />
<meta property="og:title" content="Broski Barbería — Déjanos tu reseña" />
<meta property="og:description" content="Tu opinión nos ayuda a seguir mejorando. Toca las estrellas y déjanos tu reseña en Google." />
<meta property="og:image" content="/logo.jpg" />
<meta property="og:type" content="website" />
<style>
  :root{
    --bg: #050505;
    --ink: #f5f5f3;
    --muted: #9a9a94;
    --accent: #e7e2d6;
    --accent-glow: rgba(231,226,214,0.18);
    --card-border: rgba(231,226,214,0.18);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height: 100dvh;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    padding: 32px 18px 48px;
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(231,226,214,0.10) 0%, rgba(231,226,214,0) 60%),
      radial-gradient(80% 60% at 50% 100%, rgba(20,20,18,0.7) 0%, rgba(5,5,5,0) 60%),
      var(--bg);
    position: relative;
    overflow-x: hidden;
  }

  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(231,226,214,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(231,226,214,0.04) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(60% 50% at 50% 20%, black, transparent 75%);
    pointer-events:none;
  }

  .card{
    position:relative;
    width:100%;
    max-width: 440px;
    text-align:center;
  }

  .logo-wrap{
    width: 148px;
    height: 148px;
    margin: 0 auto 6px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(145deg, var(--accent), rgba(231,226,214,0.05));
    box-shadow: 0 0 0 1px rgba(231,226,214,0.25), 0 20px 60px -15px var(--accent-glow);
  }

  .logo-wrap img{
    width:100%;
    height:100%;
    object-fit: cover;
    border-radius: 50%;
    display:block;
    background: #000;
  }

  h1{
    font-size: 26px;
    line-height: 1.25;
    letter-spacing: 0.01em;
    margin: 22px 0 6px;
    font-weight: 700;
  }

  h1 span{
    color: var(--accent);
  }

  p.sub{
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 26px;
    padding: 0 8px;
  }

  .stars{
    display:flex;
    justify-content:center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .stars button{
    -webkit-tap-highlight-color: transparent;
    background:none;
    border:none;
    padding:6px;
    cursor:pointer;
    line-height:0;
  }

  .stars svg{
    width: 34px;
    height: 34px;
    stroke: var(--muted);
    stroke-width: 1.5;
    fill: transparent;
    transition: transform .15s ease, fill .15s ease, stroke .15s ease;
  }

  .stars button:active svg{
    transform: scale(0.88);
  }

  .stars button.filled svg{
    fill: var(--accent);
    stroke: var(--accent);
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }

  .cta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    width:100%;
    padding: 16px 20px;
    border-radius: 14px;
    background: linear-gradient(135deg, #ffffff, #cfc9ba);
    color: #0a0a08;
    font-weight: 700;
    font-size: 16px;
    text-decoration:none;
    border: none;
    box-shadow: 0 14px 34px -12px rgba(231,226,214,0.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .cta:active{
    transform: translateY(1px) scale(0.99);
    box-shadow: 0 8px 20px -12px rgba(231,226,214,0.35);
  }

  .cta svg{ width:20px; height:20px; flex-shrink:0; }

  .cta-secondary{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    width:100%;
    padding: 14px 20px;
    margin-top: 12px;
    border-radius: 14px;
    background: transparent;
    color: var(--ink);
    font-weight: 600;
    font-size: 15px;
    text-decoration:none;
    border: 1px solid var(--card-border);
    transition: transform .15s ease, background .15s ease;
  }

  .cta-secondary:active{
    transform: translateY(1px) scale(0.99);
    background: rgba(231,226,214,0.08);
  }

  .cta-secondary svg{ width:20px; height:20px; flex-shrink:0; }

  .divider{
    display:flex;
    align-items:center;
    gap: 12px;
    margin: 26px 0 18px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .divider::before,
  .divider::after{
    content:"";
    flex:1;
    height:1px;
    background: linear-gradient(90deg, transparent, var(--card-border), transparent);
  }

  .meta{
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }

  .meta strong{
    color: var(--ink);
    display:block;
    font-size: 15px;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }

  footer{
    margin-top: 34px;
    color: rgba(154,154,148,0.55);
    font-size: 11px;
    letter-spacing: 0.03em;
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="/logo.jpg" alt="Broski Barbería" />
    </div>

    <h1>¿Cómo fue tu <span>experiencia</span>?</h1>
    <p class="sub">Toca las estrellas y cuéntale al mundo lo que piensas de Broski Barbería.</p>

    <div class="stars" id="stars">
      <button type="button" data-v="1" aria-label="1 estrella">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.63 22 9.24 16.5 14.14 18.18 21 12 17.27 5.82 21 7.5 14.14 2 9.24 8.91 8.63"/></svg>
      </button>
      <button type="button" data-v="2" aria-label="2 estrellas">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.63 22 9.24 16.5 14.14 18.18 21 12 17.27 5.82 21 7.5 14.14 2 9.24 8.91 8.63"/></svg>
      </button>
      <button type="button" data-v="3" aria-label="3 estrellas">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.63 22 9.24 16.5 14.14 18.18 21 12 17.27 5.82 21 7.5 14.14 2 9.24 8.91 8.63"/></svg>
      </button>
      <button type="button" data-v="4" aria-label="4 estrellas">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.63 22 9.24 16.5 14.14 18.18 21 12 17.27 5.82 21 7.5 14.14 2 9.24 8.91 8.63"/></svg>
      </button>
      <button type="button" data-v="5" aria-label="5 estrellas">
        <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.63 22 9.24 16.5 14.14 18.18 21 12 17.27 5.82 21 7.5 14.14 2 9.24 8.91 8.63"/></svg>
      </button>
    </div>

    <a class="cta" id="reviewBtn" href="https://www.google.com/maps/place/Barberia+broski/@40.3958055,-3.7362385,15z/data=!4m12!1m2!2m1!1ssimo+barber!3m8!1s0xd422765a8aa025d:0x5be951685585f141!8m2!3d40.3958055!4d-3.7171841!9m1!1b1!15sCgtzaW1vIGJhcmJlcloNIgtzaW1vIGJhcmJlcpIBC2JhcmJlcl9zaG9wmgEkQ2hkRFNVaE5NRzluUzBWSlEwRm5TVU5FTldWNVEycG5SUkFC4AEA-gEECAAQPQ!16s%2Fg%2F11jpwkxw9s?entry=ttu&amp;g_ep=EgoyMDI2MDkwMi4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.2-2 13.9-5.4l-6.4-5.4C29.4 34.9 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.9l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.4 5.4C40.8 36.1 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Dejar reseña en Google
    </a>

    <a class="cta-secondary" href="https://www.instagram.com/barberia_broski/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.3"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
      Síguenos en Instagram
    </a>

    <div class="divider">Broski Barbería</div>

    <div class="meta">
      <strong>Gracias por tu visita</strong>
      Tu reseña nos ayuda a seguir creciendo.
    </div>
  </div>

  <footer>Hecho con ✂️ para Broski Barbería</footer>

<script>
  const starsEl = document.getElementById('stars');
  const reviewUrl = document.getElementById('reviewBtn').href;

  starsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const val = parseInt(btn.dataset.v, 10);

    [...starsEl.children].forEach((b, i) => {
      b.classList.toggle('filled', i < val);
    });

    setTimeout(() => {
      window.location.href = reviewUrl;
    }, 260);
  });
</script>
</body>
</html>
